<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dashboard</title>
        <link href="css/style.css" rel="stylesheet" />
        <link href="css/calendar.css" rel="stylesheet" />
        <link href="css/search.css" rel="stylesheet" />
    </head>

    <body>
        <div class="calendar">
            <div class="calendar-container">
                <div class="time-date">
                    <div id="hour-container" class="time-box">
                        <p id="hour" class="time-upper">12</p>
                        <p id="meridiem" class="time-lower">PM</p>
                    </div>
                    <div id="minute-container" class="time-box">
                        <p id="minute" class="time-upper">44</p>
                        <p id="day" class="time-lower">Tuesday</p>
                    </div>
                </div>
                <div id="schedule-container">
                    <div class="class-card">
                        <div class="class-card-color"></div>
                        <div class="class-card-text">
                            <p class="class-card-text-name">Calculus II</p>
                            <p class="class-card-text-time">9:00-9:50</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="search">
            <h1 id="search-date">Today is, April 10</h1>
            <input id="search-input" type="search" name="" value="" />
            <div class="search-bookmarks">
                <div class="search-bookmark"></div>
                <div class="search-bookmark"></div>
                <div class="search-bookmark"></div>
                <div class="search-bookmark"></div>
                <div class="search-bookmark"></div>
            </div>
        </div>
        <div class="classes"></div>
    </body>
</html>
